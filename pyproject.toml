[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-followup-detector"
version = "0.1.0"
description = "Detect and rewrite follow-up queries for AI applications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
    {name = "Shripad Vaidya"}
]

keywords = [
    "ai",
    "llm",
    "follow-up",
    "conversation",
    "nlp",
    "langchain",
    "chatbot"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]

dependencies = []

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0"
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0"
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ai-followup-detector"
Repository = "https://github.com/YOUR_USERNAME/ai-followup-detector"
Issues = "https://github.com/YOUR_USERNAME/ai-followup-detector/issues"